    <!-- Critical inline styles: paint the boot loader before any CSS bundle loads -->
    <style>
      #app-boot-loader{
        position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;background:#fff7fb;
        color:#2e2230;transition:opacity .35s ease,visibility .35s ease;
      }
      #app-boot-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      #app-boot-loader .boot-dots{display:flex;align-items:center;gap:8px}
      #app-boot-loader .boot-dots span{
        width:12px;height:12px;border-radius:999px;
        animation:boot-bounce 1.1s infinite ease-in-out both;
        -webkit-animation:boot-bounce 1.1s infinite ease-in-out both;
      }
      #app-boot-loader .boot-dots span:nth-child(1){background:#ec2a86;animation-delay:0s}
      #app-boot-loader .boot-dots span:nth-child(2){background:#ffcc33;animation-delay:.15s}
      #app-boot-loader .boot-dots span:nth-child(3){background:#1ea7ff;animation-delay:.3s}
      #app-boot-loader .boot-label{
        font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-size:13px;font-weight:700;
        color:#7a6e82;margin:0;text-align:center;padding-inline:16px;
      }
      @keyframes boot-bounce{
        0%,80%,100%{transform:translateY(0) scale(1);opacity:.55}
        40%{transform:translateY(-10px) scale(1.08);opacity:1}
      }
      @media (prefers-reduced-motion: reduce){
        #app-boot-loader .boot-dots span{animation-duration:2.5s}
      }
    </style>
